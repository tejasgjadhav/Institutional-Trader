function tabs(el, items, cur, cb){
  el.innerHTML = "";
  items.forEach(it=>{
    const b=document.createElement("button");
    b.textContent = it.label; if(it.value===cur) b.className="on";
    b.onclick=()=>cb(it.value); el.appendChild(b);
  });
}
function render(){
  tabs($("idxTabs"), [{label:"SENSEX (30)",value:"SENSEX"},{label:"NIFTY (50)",value:"NIFTY"},{label:"● LIVE",value:"LIVE"}],
       mode==="LIVE"?"LIVE":idx, v=>{ if(v==="LIVE"){mode="LIVE";} else {mode="REPLAY"; idx=v;} render(); });
  if(mode==="LIVE"){ $("dayTabs").innerHTML=""; $("replayPanel").style.display="none"; $("livePanel").style.display="block"; startLive(); drawSummary(); return; }
  $("replayPanel").style.display="block"; $("livePanel").style.display="none"; stopLive();
  const days = Object.keys(DATA[idx].days);
  const dn = {"2026-08-03":"Mon 3 Aug","2026-08-04":"Tue 4 Aug","2026-08-05":"Wed 5 Aug"};
  tabs($("dayTabs"), days.map(d=>({label:dn[d],value:d})), day, v=>{day=v;render();});
  const D = DATA[idx].days[day];
  const gap = D.official - D.calc1518, gp = 100*gap/D.calc1518;
  $("tiles").innerHTML = `
    <div class="tile"><div class="k">Calc @15:18</div><div class="v">${fmt(D.calc1518)}</div><div class="d">index printed ${fmt(D.idx1518)}</div></div>

  catch(e){ /* static-file mode: fall back to embedded data */ }
  renderSummary();
}
function renderSummary(){
  let out = "";
  (mode==="LIVE" ? ["SENSEX","NIFTY"] : [idx]).forEach(ix=>{ out += summaryTable(ix); });

}
function summaryTable(idx){
  const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  let h = `<div class="note" style="border-left-color:var(--series-2)"><b>${idx} — print vs calculated, daily record</b>
    <table><tr><th>day</th><th>print @15:15</th><th>calc @15:15</th><th>&Delta;</th>
    <th>official close (15:30)</th><th>calc @15:18</th><th>&Delta; (auction gap)</th><th>recorded at</th></tr>`;
  let rows;
  if(SUMROWS){
    rows = SUMROWS.filter(r=>r.idx===idx).map(r=>({d:r.date, p15:r.print_1515, c15:r.calc_1515,
      off:r.official_close, c18:r.calc_1518, gap:r.auction_gap,
      ts:(r.recorded_at||"").replace("T"," ").slice(0,16)}));
  } else {
    rows = Object.keys(DATA[idx].days).map(d=>{
      const D = DATA[idx].days[d]; const i15 = D.times.indexOf("15:15");
      return {d:d, p15:D.index[i15], c15:D.calc[i15], off:D.official, c18:D.calc1518,
              gap:+(D.official-D.calc1518).toFixed(2), ts:"(embedded)"};
    });
  }
  rows.forEach(r=>{
    const dt = new Date(r.d+"T00:00:00");
    h += `<tr><td>${wd[dt.getDay()]} ${r.d.slice(8,10)} ${dt.toLocaleString("en",{month:"short"})}</td>
      <td>${fmt(r.p15)}</td><td>${fmt(r.c15)}</td><td>${(r.c15-r.p15).toFixed(2)}</td>
      <td>${fmt(r.off)}</td><td>${fmt(r.c18)}</td><td><b>${r.gap>=0?"+":""}${r.gap.toFixed(2)}</b></td>
      <td style="color:var(--text-muted)">${r.ts}</td></tr>`;
  });
  h += `</table><div style="margin-top:6px;font-size:12px;color:var(--text-muted)">&Delta; @15:15 is fit error
    (calculated vs the still-live print). The last column is the auction: the index is frozen from
    15:15, so official close &minus; calc@15:18 is the move struck in the closing auction. A new row
    is recorded every trading day at 15:50 IST.</div></div>`;
  return h;
}
function drawSummary(){ if(SUMROWS===null){ loadSummary(); } else { renderSummary(); } }

  const n=D.times.length;
  const all=[...D.calc,...D.index,D.official];
  let lo=Math.min(...all), hi=Math.max(...all); const pad=(hi-lo)*0.08||1; lo-=pad; hi+=pad;
  const X=i=>L+(W-L-R)*i/(n-1), Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g="";
  const yt=5; for(let i=0;i<=yt;i++){const v=lo+(hi-lo)*i/yt,y=Y(v);
    g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`+
       `<text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--text-muted)">${Math.round(v).toLocaleString("en-IN")}</text>`;}
  for(let i=0;i<n;i+=5){g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${D.times[i]}</text>`;}
  const auc=D.times.indexOf("15:15");
  if(auc>=0) g+=`<rect x="${X(auc)}" y="${T}" width="${W-R-X(auc)}" height="${H-T-B}" fill="var(--text-muted)" opacity="0.07"/>`+
    `<text x="${X(auc)+6}" y="${T+14}" font-size="11" fill="var(--text-muted)">auction</text>`;
  const oy=Y(D.official);
  g+=`<line x1="${L}" x2="${W-R}" y1="${oy}" y2="${oy}" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="6 5"/>`+
     `<text x="${W-R}" y="${oy-6}" text-anchor="end" font-size="11" fill="var(--text-secondary)">official ${fmt(D.official)}</text>`;
  const path=a=>a.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  g+=`<path d="${path(D.index)}" fill="none" stroke="var(--series-2)" stroke-width="2"/>`;
  g+=`<path d="${path(D.calc)}" fill="none" stroke="var(--series-1)" stroke-width="2"/>`;
  const li=n-1;
  g+=`<text x="${X(li)-4}" y="${Y(D.calc[li])-8}" text-anchor="end" font-size="11.5" fill="var(--text-primary)">calculated</text>`;
  g+=`<circle cx="${X(li)}" cy="${Y(D.calc[li])}" r="4" fill="var(--series-1)" stroke="var(--surface-2)" stroke-width="2"/>`;
  g+=`<circle cx="${X(li)}" cy="${Y(D.index[li])}" r="4" fill="var(--series-2)" stroke="var(--surface-2)" stroke-width="2"/>`;
  g+=`<line id="xh" y1="${T}" y2="${H-B}" stroke="var(--text-muted)" stroke-width="1" opacity="0"/>`;
  svg.innerHTML=g;
  const tip=$("tip"), xh=svg.querySelector("#xh");
  svg.onmousemove=e=>{
    const r=svg.getBoundingClientRect(), mx=(e.clientX-r.left)*W/r.width;
    let i=Math.round((mx-L)/(W-L-R)*(n-1)); i=Math.max(0,Math.min(n-1,i));
    xh.setAttribute("x1",X(i)); xh.setAttribute("x2",X(i)); xh.setAttribute("opacity",.5);
    tip.style.display="block";
    tip.innerHTML=`<span style="color:var(--text-muted)">${D.times[i]}</span><br>calc <b>${fmt(D.calc[i])}</b><br>index <b>${fmt(D.index[i])}</b><br>diff <b>${(D.calc[i]-D.index[i]).toFixed(2)}</b>`;
    const wrap=svg.parentElement.getBoundingClientRect();
    let tx=e.clientX-wrap.left+14; if(tx>wrap.width-150) tx=e.clientX-wrap.left-150;
    tip.style.left=tx+"px"; tip.style.top=(e.clientY-wrap.top-10)+"px";
  };
  svg.onmouseleave=()=>{tip.style.display="none"; xh.setAttribute("opacity",0);};
}
function drawTable(D){
  let h="<table><tr><th>time</th><th>calculated</th><th>published index</th><th>diff (pts)</th></tr>";
  D.times.forEach((t,i)=>{h+=`<tr><td>${t}</td><td>${fmt(D.calc[i])}</td><td>${fmt(D.index[i])}</td><td>${(D.calc[i]-D.index[i]).toFixed(2)}</td></tr>`;});
  h+=`<tr><td>official close</td><td>${fmt(D.calc_close)}</td><td>${fmt(D.official)}</td><td>${(D.calc_close-D.official).toFixed(2)}</td></tr></table>`;
  $("tbl").innerHTML=h;
}
function stopLive(){ if(liveTimer){clearInterval(liveTimer); liveTimer=null;} }
function startLive(){
  if(liveTimer) return;
  pollLive();
  liveTimer=setInterval(pollLive,5000);
}
async function pollLive(){
  let j;
  try{ j = await (await fetch("/live",{cache:"no-store"})).json(); }
  catch(e){ $("liveNote").innerHTML = "Server not reachable. Start it with:<br><code>cd ~/files/institutional-trader && ./.venv/bin/python studies/CAS_NIFTY_SENSEX_DATA/live_calc_server.py</code> then open <code>http://localhost:8787</code>"; return; }
  if(j.status!=="ok"){ $("liveNote").textContent = j.status==="warming" ? "Warming up — fitting weights from the latest session (1–2 min)…" : ("Server status: "+j.status); return; }
  let tiles="";
  j.rows.forEach(r=>{
    if(r.diff!==null) hist[r.idx].push({t:j.ts, d:r.diff});
    if(hist[r.idx].length>240) hist[r.idx].shift();
    const pos = r.diff>=0;
    tiles += `
    <div class="tile"><div class="k">${r.idx} live</div><div class="v">${r.live?fmt(r.live):"–"}</div><div class="d">exchange print</div></div>
    <div class="tile"><div class="k">${r.idx} calculated</div><div class="v">${r.calc?fmt(r.calc):"–"}</div><div class="d">from ${r.idx==="SENSEX"?30:50} constituents${r.missing.length?` (missing ${r.missing.length})`:""}</div></div>
    <div class="tile"><div class="k">${r.idx} diff</div><div class="v">${r.diff===null?"–":(pos?"+":"")+fmt(r.diff)}</div><div class="d">${r.diff_pct===null?"":(pos?"+":"")+r.diff_pct.toFixed(3)+"% live − calc"}</div></div>`;
  });
  $("liveTiles").innerHTML = tiles;
  $("liveNote").innerHTML = `Updated <b>${j.ts}</b> IST · polling every 5s · weights fit on <b>${j.fit_day}</b>`+
    (j.market_open?"" : " · <b>market closed</b> — prices are last session's, diff is not meaningful")+
    ` · <button onclick="fetch('/refit',{method:'POST'})" style="font-size:11px;margin-left:6px">refit weights</button>`;
  drawLive();
}
function drawLive(){
  const svg=$("liveCh"), W=svg.clientWidth||920, H=220, L=56, R=12, T=12, B=24;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const A=hist.SENSEX, N=hist.NIFTY;
  if(!A.length&&!N.length){svg.innerHTML="";return;}
  const all=[...A.map(x=>x.d),...N.map(x=>x.d),0];
  let lo=Math.min(...all), hi=Math.max(...all); const pad=(hi-lo)*0.15||1; lo-=pad; hi+=pad;
  const n=Math.max(A.length,N.length,2);
  const X=i=>L+(W-L-R)*i/(n-1), Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4 4"/>`;
  [[A,"var(--series-1)","SENSEX"],[N,"var(--series-2)","NIFTY"]].forEach(([a,c,lbl])=>{
    if(!a.length) return;
    g+=`<path d="${a.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.d).toFixed(1)).join(" ")}" fill="none" stroke="${c}" stroke-width="2"/>`;
    g+=`<text x="${X(a.length-1)-4}" y="${Y(a[a.length-1].d)-8}" text-anchor="end" font-size="11" fill="var(--text-primary)">${lbl} ${a[a.length-1].d.toFixed(1)}</text>`;
  });
  g+=`<text x="${L-8}" y="${Y(0)+4}" text-anchor="end" font-size="11" fill="var(--text-muted)">0</text>`;
  g+=`<text x="${L-8}" y="${T+8}" text-anchor="end" font-size="11" fill="var(--text-muted)">${hi.toFixed(0)}</text>`;
  g+=`<text x="${L-8}" y="${H-B}" text-anchor="end" font-size="11" fill="var(--text-muted)">${lo.toFixed(0)}</text>`;
  svg.innerHTML=g;
}
render();
window.addEventListener("resize",()=>{ if(mode==="REPLAY") drawChart(DATA[idx].days[day]); else drawLive(); });
</script>
